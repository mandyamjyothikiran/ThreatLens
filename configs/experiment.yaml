project:
  name: "ThreatLens"
  version: "1.0.0"
  description: "Machine Learning-Based Zero-Day Attack Detection Framework"
  random_seed: 42

dataset:
  primary: "CIC-IDS2017"
  url: "https://www.unb.ca/cic/datasets/ids-2017.html"
  sample_path: "data/cicids2017_sample.csv"
  heldout_sample_path: "data/cicids2017_heldout_sample.csv"
  label_column: "Label"
  normal_label: "BENIGN"
  irrelevant_columns:
    - "Flow ID"
    - "Source IP"
    - "Destination IP"
    - "Timestamp"
    - "SimillarHTTP"

features:
  selected_numerical_features:
    - "Destination Port"
    - "Flow Duration"
    - "Total Fwd Packets"
    - "Total Backward Packets"
    - "Total Length of Fwd Packets"
    - "Total Length of Bwd Packets"
    - "Fwd Packet Length Max"
    - "Fwd Packet Length Min"
    - "Fwd Packet Length Mean"
    - "Bwd Packet Length Mean"
    - "Flow Bytes/s"
    - "Flow Packets/s"
    - "Flow IAT Mean"
    - "Flow IAT Std"
    - "Flow IAT Max"
    - "Fwd IAT Mean"
    - "Bwd IAT Mean"
    - "SYN Flag Count"
    - "ACK Flag Count"
    - "Average Packet Size"
    - "Init_Win_bytes_forward"
    - "Init_Win_bytes_backward"

preprocessing:
  scaler: "RobustScaler"
  handle_infinity: "replace_with_quantile_max"
  handle_nan: "median_imputation"
  drop_duplicates: true
  train_split: 0.60
  val_split: 0.20
  test_split: 0.20

models:
  isolation_forest:
    n_estimators: 150
    max_samples: "auto"
    contamination: 0.05
    random_state: 42
    n_jobs: -1
  random_forest:
    n_estimators: 100
    max_depth: 16
    min_samples_split: 5
    random_state: 42
    n_jobs: -1

unseen_attack_experiment:
  held_out_attack_categories:
    - "PortScan"
    - "Infiltration"
    - "Botnet"
  known_attack_categories:
    - "DoS Hulk"
    - "FTP-Patator"
    - "SSH-Patator"
  normal_training_only: true

thresholding:
  method: "percentile_validation"
  percentile: 95.0
  fallback_fixed_threshold: -0.05
